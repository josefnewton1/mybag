name: Compile APK Android com Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache git zip unzip python3-pip \
          libssl-dev zlib1g-dev libffi-dev libltdl-dev \
          libncurses5-dev autoconf automake libtool pkg-config cmake

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.36

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          sltellantisBag/.buildozer
          ~/.buildozer
        key: ${{ runner.os }}-buildozer-v4-${{ hashFiles('sltellantisBag/buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-v4-

    - name: Build with Buildozer
      working-directory: sltellantisBag
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: sltellantisBag/bin/*.apk
        if-no-files-found: error
