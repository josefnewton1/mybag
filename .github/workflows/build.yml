
name: Compilar APK Android com Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java (necessário para o Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
  
      - name: Instalar dependências do sistema Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Compilar APK com Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer -v android debug

      - name: Salvar o APK gerado (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: bin/*.apk
