name: Compile APK Android com Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          libffi-dev \
          libssl-dev \
          zlib1g-dev \
          openjdk-17-jdk \
          unzip \
          ant \
          autoconf \
          automake \
          libtool \
          pkg-config

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.36

    - name: Cache Buildozer directories
      uses: actions/cache@v3
      with:
        path: |
          .buildozer
          ~/.buildozer
        key: ${{ runner.os }}-buildozer-v3-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-v3-

    - name: Limpar build anterior corrompido
      run: |
        cd sltellantisBag || true
        rm -rf .buildozer/android/platform/build-*

    - name: Build with Buildozer
      run: |
        cd sltellantisBag || true
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: sltellantisBag/bin/*.apk
