name: Compile APK Android com Buildozer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-python \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev

      - name: Upgrade pip and install buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer==1.5.0

      - name: Cache Buildozer global directory
        uses: actions/cache@v3
        with:
          path: |
            .buildozer
            sltellantisBag/.buildozer
          key: ${{ runner.os }}-buildozer-v4-${{ hashFiles('sltellantisBag/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v4-

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        working-directory: sltellantisBag
        with:
          command: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: package
          path: sltellantisBag/bin/*.apk
