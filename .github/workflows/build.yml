name: Compile APK Android com Buildozer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Build with Buildozer
      uses: kivy/buildozer-action@v1
      with:
        buildozer_version: master
        android_ndk: r25b
        command: buildozer -v android debug
      env:
        WORKDIR: sltellantisBag

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: pacotes-apk
        path: sltellantisBag/bin/*.apk
